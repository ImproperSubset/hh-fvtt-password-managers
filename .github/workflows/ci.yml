name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Check copyright and license information
        uses: fsfe/reuse-action@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the manifest's scripts exist
        run: |
          for file in $(jq -r '.esmodules[]' module.json); do
            if [ ! -f "$file" ]; then
              echo "::error file=module.json::esmodules lists $file, which does not exist"
              exit 1
            fi
          done
